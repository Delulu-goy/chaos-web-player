# cPanel Git Version Control — auto-deploy config
# Questo file viene letto da cPanel dopo ogni `git pull` per eseguire
# comandi di build e deploy automatici.
# Docs: https://docs.cpanel.net/cpanel/files/domains/manage-git-version-control/
#
# Layout del server Stellar:
#   /home/tuouser/radio.chaosroom.online/
#   ├── .htaccess                    ← config Apache (manuale, NON committato)
#   ├── tmp/                         ← restart.txt per Passenger
#   ├── frontend/dist/               ← build Vite (generata qui)
#   └── repo/                        ← codice sorgente clonato
#       └── chaos-web-player/
#           ├── backend/
#           └── frontend/

---
deployment:
  tasks:
    # Setup paths (adattare tuouser al proprio username cPanel)
    - export DEPLOY_ROOT=/home/$CPANEL_USER/radio.chaosroom.online
    - export SOURCE_ROOT=$DEPLOY_ROOT/repo/chaos-web-player
    - export FRONTEND_DEPLOY=$DEPLOY_ROOT/frontend

    # ── Backend ────────────────────────────────
    - cd $SOURCE_ROOT/backend
    - echo "[deploy] installing backend dependencies..."
    - npm install --production
    - echo "[deploy] generating Prisma client..."
    - npx prisma generate
    - echo "[deploy] running migrations..."
    - npx prisma migrate deploy
    - echo "[deploy] ensuring private dirs exist..."
    - mkdir -p $SOURCE_ROOT/backend/private/audio
    - mkdir -p $SOURCE_ROOT/backend/private/covers

    # ── Frontend ───────────────────────────────
    - cd $SOURCE_ROOT/frontend
    - echo "[deploy] installing frontend dependencies..."
    - npm install
    - echo "[deploy] building frontend..."
    - npm run build
    - echo "[deploy] copying dist to public path..."
    - mkdir -p $FRONTEND_DEPLOY/dist
    - rm -rf $FRONTEND_DEPLOY/dist/*
    - cp -r dist/. $FRONTEND_DEPLOY/dist/

    # ── Restart Node app ───────────────────────
    # Phusion Passenger (Stellar) auto-restart su touch di tmp/restart.txt
    - mkdir -p $DEPLOY_ROOT/tmp
    - touch $DEPLOY_ROOT/tmp/restart.txt
    - echo "[deploy] ✓ Deploy complete. Node app restarting..."