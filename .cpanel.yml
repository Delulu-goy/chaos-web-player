# cPanel Git Version Control — auto-deploy config
# Questo file viene letto da cPanel dopo ogni `git pull` per eseguire
# comandi di build e deploy automatici.
# Docs: https://docs.cpanel.net/cpanel/files/domains/manage-git-version-control/
#
# Layout del server Stellar:
#   /home/tuouser/radio.chaosroom.online/     ← ROOT DEL CLONE GIT (= doc root)
#   ├── .htaccess                    ← config Apache/Passenger (CloudLinux, NON committato)
#   ├── .cpanel.yml                  ← questo file
#   ├── tmp/                         ← restart.txt per Passenger (doc root)
#   └── chaos-web-player/            ← il pacchetto del repo
#       ├── backend/                 ← APPLICATION ROOT di Passenger
#       │   ├── private/audio/       ← MP3 (libreria + edizioni Pirate Day)
#       │   └── tmp/restart.txt      ← marker di restart (quello che conta)
#       └── frontend/dist/           ← build Vite COMMITTATA, servita da Express
#
# Attenzione: il clone git è la ROOT del documento e NON una sottocartella
# `repo/`. L'application root del Node.js App è `chaos-web-player/backend`,
# quindi $SOURCE_ROOT/backend coincide con il codice che gira davvero: la
# pipeline aggiorna la copia che esegue il backend.
#
# Il FRONTEND non viene ricostruito qui: il `dist/` è committato nel repo
# e l'app Express lo serve (express.static su chaos-web-player/frontend/dist).
# Ricostruirlo sul server avrebbe due effetti negativi: sporca il working
# tree (i pull successivi fallirebbero con "local changes would be
# overwritten") e consuma 1-2 minuti di RAM scarso su Stellar.
# Regola: si builda e committa il dist in locale, poi si pusha.

---
deployment:
  tasks:
    # Setup paths (adattare tuouser al proprio username cPanel)
    - export DEPLOY_ROOT=/home/$CPANEL_USER/radio.chaosroom.online
    - export SOURCE_ROOT=$DEPLOY_ROOT/chaos-web-player

    # ── Backend ────────────────────────────────
    - cd $SOURCE_ROOT/backend
    - echo "[deploy] ffmpeg: $(which ffmpeg 2>/dev/null || echo 'non installato')"
    - echo "[deploy] installing backend dependencies..."
    - npm install --production || echo "[deploy] npm install fallito: si prosegue con le dipendenze già presenti"
    - echo "[deploy] generating Prisma client..."
    - npx prisma generate || echo "[deploy] prisma generate non eseguibile su Stellar: si usa il client committato in generated/prisma/"
    - echo "[deploy] running migrations..."
    - npx prisma migrate deploy || echo "[deploy] prisma migrate deploy non eseguibile su Stellar: le migration si applicano da phpMyAdmin"
    - echo "[deploy] ensuring private dirs exist..."
    - mkdir -p $SOURCE_ROOT/backend/private/audio
    - mkdir -p $SOURCE_ROOT/backend/private/covers
    - mkdir -p $SOURCE_ROOT/backend/private/waveforms
    - mkdir -p $SOURCE_ROOT/backend/private/avatars
    - mkdir -p $SOURCE_ROOT/backend/logs

    # ── Frontend (dist committato, non ricostruito) ──────────────────
    - cd $SOURCE_ROOT/frontend
    - echo "[deploy] frontend bundle servito: $(ls dist/assets/index-*.js 2>/dev/null | head -1)"
    - echo "[deploy] (il dist è committato nel repo: non viene ricostruito qui)"

    # ── Restart Node app ───────────────────────
    # Phusion Passenger (Stellar) ricarica il processo quando vede
    # tmp/restart.txt nell'APPLICATION ROOT. Il marker nel document root
    # viene toccato comunque, per coprire le convenzioni alternative.
    - mkdir -p $DEPLOY_ROOT/tmp
    - mkdir -p $SOURCE_ROOT/backend/tmp
    - touch $DEPLOY_ROOT/tmp/restart.txt
    - touch $SOURCE_ROOT/backend/tmp/restart.txt
    - echo "[deploy] ✓ Deploy complete. Node app restart triggered."
    - echo "[deploy] verifica: curl -s https://radio.chaosroom.online/api/debug (campo git.sha = commit in esecuzione)"
